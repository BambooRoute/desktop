name: Publish existing desktop preview

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed desktop packaging run with successful macOS and Windows jobs
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-publish-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out Bamboo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
      - name: Verify source packaging run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          BAMBOO_SOURCE_RUN: ${{ inputs.run_id }}
        run: node scripts/release-source.mjs
      - name: Download verified installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run }}
          pattern: bamboo-preview-*-${{ steps.source.outputs.number }}-*
          path: .local/release-artifacts
          digest-mismatch: error
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          BAMBOO_RELEASE_VERSION: ${{ steps.source.outputs.version }}
          BAMBOO_RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
          BAMBOO_RELEASE_RUN: ${{ steps.source.outputs.run }}
          BAMBOO_RELEASE_NUMBER: ${{ steps.source.outputs.number }}
          BAMBOO_RELEASE_ATTEMPT: ${{ steps.source.outputs.attempt }}
        run: node scripts/release.mjs
